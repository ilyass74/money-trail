money_trail:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('MT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('MT_PORT', '55432') | int }}"
      user: "{{ env_var('MT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_MT_PASSWORD') }}"
      dbname: "{{ env_var('MT_DATABASE') }}"
      schema: staging
      threads: "{{ env_var('MT_THREADS', '2') | int }}"
      connect_timeout: 10
