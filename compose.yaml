name: money-trail

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money_trail}
      POSTGRES_USER: ${POSTGRES_USER:-moneytrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancer scripts/prepare.ps1 pour creer .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schemas.sql:/docker-entrypoint-initdb.d/001_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
